services:
  default:
    ports:
      - '${BIND_ADDRESS:-127.0.0.1}:${BIND_PORT:-8421}:80/tcp'

  databases:
    ports:
      - '${BIND_ADDRESS:-127.0.0.1}:${BIND_PORT:-8421}:80/tcp'
    networks:
      - default
      - databases

  traefik:
    networks:
      - default
      - traefik
    labels:
      traefik.enable: 'true'
      traefik.docker.network: '${TRAEFIK_NETWORK:-traefik}'
      traefik.http.routers.econumo.rule: 'Host(`${TRAEFIK_HOST}`)'
      traefik.http.routers.econumo.entrypoints: '${TRAEFIK_ENTRYPOINT:-websecure}'
      traefik.http.routers.econumo.middlewares: "${TRAEFIK_ACCESS_POLICY:-default-access@file}"
      traefik.http.services.econumo.loadbalancer.server.port: '${TRAEFIK_SERVICE_PORT:-80}'

  traefik_databases:
    networks:
      - default
      - traefik
      - databases
    labels:
      traefik.enable: 'true'
      traefik.docker.network: '${TRAEFIK_NETWORK:-traefik}'
      traefik.http.routers.econumo.rule: 'Host(`${TRAEFIK_HOST}`)'
      traefik.http.routers.econumo.entrypoints: '${TRAEFIK_ENTRYPOINT:-websecure}'
      traefik.http.routers.econumo.middlewares: "${TRAEFIK_ACCESS_POLICY:-default-access@file}"
      traefik.http.services.econumo.loadbalancer.server.port: '${TRAEFIK_SERVICE_PORT:-80}'
