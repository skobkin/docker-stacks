services:
  marinara:
    extends:
      file: ./compose.features.yml
      service: "${COMPOSE_VARIANT:-traefik}"
    image: "${IMAGE_REPOSITORY:-ghcr.io/pasta-devs/marinara-engine}:${IMAGE_TAG:-lite}"
    container_name: marinara
    hostname: marinara
    # Upstream recommends init so signals reach the app: the entrypoint
    # starts as root, repairs data-dir ownership, then drops privileges.
    init: true
    env_file: .env
    environment:
      NODE_ENV: production
      DATA_DIR: /app/data
      FILE_STORAGE_DIR: /app/data/storage
      MARINARA_DOCKER: "true"
      # Off by default upstream; enabled in .env.dist so private base URLs
      # such as http://llama-swap:8080/v1 work as provider endpoints.
      PROVIDER_LOCAL_URLS_ENABLED: "${PROVIDER_LOCAL_URLS_ENABLED:-false}"
      TZ: "${TZ:-UTC}"
    volumes:
      - "${HOST_DATA_DIR:-./data}:/app/data"
    healthcheck:
      # GET /api/health is the documented passwordless uptime endpoint
      # (REMOTE_ACCESS.md); Node is guaranteed in the image, unlike curl
      # or wget.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7860/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "${LOG_MAX_SIZE:-5m}"
        max-file: "${LOG_MAX_FILE:-5}"
    networks:
      - ai-tools

networks:
  ai-tools:
    external: true
  traefik:
    external: true
    name: "${TRAEFIK_NETWORK:-traefik}"
