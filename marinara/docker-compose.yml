services:
  marinara:
    extends:
      file: ./compose.features.yml
      service: "${COMPOSE_VARIANT:-traefik}"
    # Full image by default: chosen for the application features it
    # unlocks (built-in memory features), not for its built-in
    # inference runtime - see README "Recommended setup: Full with
    # external inference".
    # IMAGE_TAG=lite selects the smaller variant without the local models.
    image: "${IMAGE_REPOSITORY:-ghcr.io/pasta-devs/marinara-engine}:${IMAGE_TAG:-latest}"
    container_name: marinara
    hostname: marinara
    # Upstream recommends init so signals reach the app: the entrypoint
    # starts as root, repairs data-dir ownership, then drops privileges.
    init: true
    env_file: .env
    environment:
      NODE_ENV: production
      DATA_DIR: /app/data
      FILE_STORAGE_DIR: /app/data/storage
      MARINARA_DOCKER: "true"
      # Off by default upstream; enabled in .env.dist so private base URLs
      # such as http://llama-swap:8080/v1 work as provider endpoints.
      PROVIDER_LOCAL_URLS_ENABLED: "${PROVIDER_LOCAL_URLS_ENABLED:-false}"
      TZ: "${TZ:-UTC}"
    volumes:
      - "${HOST_DATA_DIR:-./data}:/app/data"
    # No healthcheck here: it is variant-specific and defined per variant in
    # compose.features.yml (extends gives the extending service precedence).
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "${LOG_MAX_SIZE:-5m}"
        max-file: "${LOG_MAX_FILE:-5}"
    networks:
      - ai-tools

networks:
  ai-tools:
    external: true
  traefik:
    external: true
    name: "${TRAEFIK_NETWORK:-traefik}"
