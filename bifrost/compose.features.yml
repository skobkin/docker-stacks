services:
  default:
    ports:
      - '${BIND_ADDRESS:-127.0.0.1}:${BIND_PORT:-8422}:8080/tcp'

  traefik:
    networks:
      - ai-tools
      - traefik
    labels:
      traefik.enable: 'true'
      traefik.docker.network: '${TRAEFIK_NETWORK:-traefik}'
      traefik.http.routers.bifrost.rule: 'Host(`${TRAEFIK_HOST}`)'
      traefik.http.routers.bifrost.entrypoints: '${TRAEFIK_ENTRYPOINT:-websecure}'
      traefik.http.routers.bifrost.middlewares: '${TRAEFIK_ACCESS_POLICY:-default-access@file}'
      traefik.http.services.bifrost.loadbalancer.server.port: '${TRAEFIK_SERVICE_PORT:-8080}'
      # LLM streams idle for minutes before the first bytes; the long-lived
      # transport drops the response-header timeout (shared dynamic config).
      traefik.http.services.bifrost.loadbalancer.serversTransport: 'long-lived@file'
