# bifrost - Self-hosted LLM gateway: Web UI, OpenAI/Anthropic-compatible APIs, MCP gateway
# https://github.com/maximhq/bifrost

services:
  bifrost:
    extends:
      file: ./compose.features.yml
      service: "${COMPOSE_VARIANT:-traefik}"
    image: 'maximhq/bifrost:${IMAGE_TAG:-latest}'
    container_name: 'bifrost'
    hostname: 'bifrost'
    env_file: '.env'
    environment:
      TZ: '${TZ:-UTC}'
    volumes:
      # Whole /app/data (APP_DIR): SQLite config store, database, request logs.
      # The image runs as UID 1000 - the host dir must be writable by it.
      - '${HOST_DATA_DIR:-./data}:/app/data'
      # Config seed mounted at /app/data/config.json. Bifrost requires the
      # file to exist and hold valid JSON even when it carries no settings,
      # so the default source is the shipped no-op template; a /dev/null
      # mount would fail startup on the empty input. To activate the seed,
      # copy config/config.json.dist to config/config.json, edit it, and
      # point HOST_CONFIG_FILE at it (see README).
      - '${HOST_CONFIG_FILE:-./config/config.json.dist}:/app/data/config.json:ro'
    restart: unless-stopped
    ulimits:
      # Upstream recommendation for many concurrent LLM streams.
      nofile: 65536
    healthcheck:
      # GET /health returns 200 when ready, 503 while failing; wget is in the image.
      test: ['CMD-SHELL', 'wget -q -T 5 -O /dev/null http://127.0.0.1:8080/health || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: 'json-file'
      options:
        max-size: '${LOG_MAX_SIZE:-5m}'
        max-file: '${LOG_MAX_FILE:-5}'
    networks:
      - ai-tools

networks:
  ai-tools:
    external: true
  traefik:
    external: true
    name: '${TRAEFIK_NETWORK:-traefik}'
