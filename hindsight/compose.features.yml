services:
  default: {}

  traefik:
    networks:
      - ai-tools
      - traefik
    labels:
      traefik.enable: "true"
      traefik.docker.network: "${TRAEFIK_NETWORK:-traefik}"

      traefik.http.routers.hindsight-api.rule: >-
        Host(`${TRAEFIK_HOST}`) &&
        (PathPrefix(`/v1`) ||
        PathPrefix(`/mcp`) ||
        PathPrefix(`/docs`) ||
        Path(`/openapi.json`) ||
        Path(`/health`) ||
        Path(`/metrics`))
      traefik.http.routers.hindsight-api.entrypoints: "${TRAEFIK_ENTRYPOINT:-websecure}"
      traefik.http.routers.hindsight-api.middlewares: "${TRAEFIK_ACCESS_POLICY:-default-access@file}"
      traefik.http.routers.hindsight-api.priority: "100"
      traefik.http.routers.hindsight-api.service: "hindsight-api"
      traefik.http.services.hindsight-api.loadbalancer.server.port: "8888"

      traefik.http.routers.hindsight-ui.rule: "Host(`${TRAEFIK_HOST}`)"
      traefik.http.routers.hindsight-ui.entrypoints: "${TRAEFIK_ENTRYPOINT:-websecure}"
      traefik.http.routers.hindsight-ui.middlewares: "${TRAEFIK_ACCESS_POLICY:-default-access@file}"
      traefik.http.routers.hindsight-ui.priority: "10"
      traefik.http.routers.hindsight-ui.service: "hindsight-ui"
      traefik.http.services.hindsight-ui.loadbalancer.server.port: "9999"
