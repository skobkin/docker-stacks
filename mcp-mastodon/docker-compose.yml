# https://git.skobk.in/skobkin/mastodon-mcp
# https://hub.docker.com/r/skobkin/mastodon-mcp

services:
  mcp-mastodon:
    extends:
      file: ./compose.features.yml
      service: "${COMPOSE_VARIANT:-default}"
    image: "skobkin/mastodon-mcp:${IMAGE_TAG:-latest}"
    container_name: mcp-mastodon
    # The image already defaults to streamable-http on 0.0.0.0:8080 via the
    # MASTODON_MCP_TRANSPORT__TYPE / MASTODON_MCP_TRANSPORT__LISTEN ENVs
    # baked into the upstream Dockerfile, so no command override is needed.
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${BIND_PORT:-8416}:8080/tcp"
    env_file: .env
    environment:
      MASTODON_MCP_MASTODON__BASE_URL: "${MASTODON_MCP_MASTODON__BASE_URL:?}"
      # Stack default is request-header auth so the MCP client supplies the
      # Mastodon access token on every request (header X-Mastodon-Access-Token
      # by default). The upstream's own default is "static", which would fail
      # validation here because no static token is configured. Operators can
      # override MASTODON_MCP_AUTH__MODE in .env to switch to "static" or
      # "hybrid" — but they must also uncomment a token source (TOKEN or
      # TOKEN_FILE) in .env.dist, otherwise upstream validation will fail.
      MASTODON_MCP_AUTH__MODE: "${MASTODON_MCP_AUTH__MODE:-request-header}"
    networks:
      - ai-tools
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "${LOG_MAX_SIZE:-5m}"
        max-file: "${LOG_MAX_FILE:-5}"

networks:
  ai-tools:
    external: true
  proxy:
    external: true
    name: "${PROXY_NETWORK:-proxy}"
  traefik:
    external: true
    name: "${TRAEFIK_NETWORK:-traefik}"
