# lanquiry - LAN inventory and device monitor (read-only RouterOS polling + optional mDNS/SSDP)
# https://git.skobk.in/skobkin/LANquiry

services:
  lanquiry:
    extends:
      file: ./compose.features.yml
      service: "${COMPOSE_VARIANT:-default}"
    image: 'skobkin/lanquiry:${IMAGE_TAG:-latest}'
    container_name: 'lanquiry'
    hostname: 'lanquiry'
    volumes:
      - '${HOST_DATA_DIR:-./data}:/data'
      - '/etc/localtime:/etc/localtime:ro'
    env_file: '.env'
    environment:
      TZ: '${TZ:-UTC}'
      LANQUIRY_DATABASE_PATH: '/data/lanquiry.db'
    restart: unless-stopped
    logging:
      driver: 'json-file'
      options:
        max-size: '${LOG_MAX_SIZE:-5m}'
        max-file: '${LOG_MAX_FILE:-5}'

networks:
  traefik:
    external: true
    name: '${TRAEFIK_NETWORK:-traefik}'
