services:
  # Bridge networking; mDNS/SSDP are disabled because multicast cannot leave
  # the Docker bridge.
  default:
    ports:
      - '${BIND_ADDRESS:-127.0.0.1}:${BIND_PORT:-8420}:8080/tcp'
    environment:
      LANQUIRY_HTTP_BIND: '0.0.0.0:8080'
      LANQUIRY_HTTP_PUBLIC_BASE_URL: '${LANQUIRY_HTTP_PUBLIC_BASE_URL:-http://127.0.0.1:8420}'
      LANQUIRY_DISCOVERY_MDNS_DISABLED: 'true'
      LANQUIRY_DISCOVERY_SSDP_DISABLED: 'true'

  # default plus Traefik labels.
  traefik:
    ports:
      - '${BIND_ADDRESS:-127.0.0.1}:${BIND_PORT:-8420}:8080/tcp'
    environment:
      LANQUIRY_HTTP_BIND: '0.0.0.0:8080'
      # Non-loopback public URLs must use https://.
      LANQUIRY_HTTP_PUBLIC_BASE_URL: '${LANQUIRY_HTTP_PUBLIC_BASE_URL:?}'
      LANQUIRY_DISCOVERY_MDNS_DISABLED: 'true'
      LANQUIRY_DISCOVERY_SSDP_DISABLED: 'true'
    networks:
      - default
      - traefik
    labels:
      traefik.enable: 'true'
      traefik.docker.network: '${TRAEFIK_NETWORK:-traefik}'
      traefik.http.routers.lanquiry.rule: 'Host(`${TRAEFIK_HOST}`)'
      traefik.http.routers.lanquiry.entrypoints: '${TRAEFIK_ENTRYPOINT:-websecure}'
      traefik.http.routers.lanquiry.middlewares: '${TRAEFIK_ACCESS_POLICY:-default-access@file}'
      traefik.http.services.lanquiry.loadbalancer.server.port: '${TRAEFIK_SERVICE_PORT:-8080}'

  # Host networking for local mDNS/SSDP discovery. ports/networks cannot be
  # used together with network_mode: host.
  host:
    network_mode: host
    environment:
      LANQUIRY_HTTP_BIND: '${BIND_ADDRESS:-127.0.0.1}:${BIND_PORT:-8420}'
      LANQUIRY_HTTP_PUBLIC_BASE_URL: '${LANQUIRY_HTTP_PUBLIC_BASE_URL:-http://127.0.0.1:8420}'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://${BIND_ADDRESS:-127.0.0.1}:${BIND_PORT:-8420}/readyz']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Host networking plus Traefik.
  traefik_host:
    network_mode: host
    environment:
      LANQUIRY_HTTP_BIND: '${BIND_ADDRESS:-127.0.0.1}:${BIND_PORT:-8420}'
      LANQUIRY_HTTP_PUBLIC_BASE_URL: '${LANQUIRY_HTTP_PUBLIC_BASE_URL:?}'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://${BIND_ADDRESS:-127.0.0.1}:${BIND_PORT:-8420}/readyz']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      traefik.enable: 'true'
      traefik.http.routers.lanquiry.rule: 'Host(`${TRAEFIK_HOST}`)'
      traefik.http.routers.lanquiry.entrypoints: '${TRAEFIK_ENTRYPOINT:-websecure}'
      traefik.http.routers.lanquiry.middlewares: '${TRAEFIK_ACCESS_POLICY:-default-access@file}'
      traefik.http.services.lanquiry.loadbalancer.server.port: '${BIND_PORT:-8420}'
