# https://git.skobk.in/skobkin/miniflux-mcp-hardened
# https://hub.docker.com/r/skobkin/miniflux-mcp-hardened

services:
  mcp-miniflux:
    extends:
      file: ./compose.features.yml
      service: "${COMPOSE_VARIANT:-default}"
    image: "skobkin/miniflux-mcp-hardened:${IMAGE_TAG:-latest}"
    container_name: mcp-miniflux
    # Image is FROM scratch with no shell — no healthcheck can be declared.
    environment:
      MINIFLUX_URL: "${MINIFLUX_URL:?}"  # upstream fails fast without this
    env_file: .env
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${BIND_PORT:-8417}:8080/tcp"
    networks:
      - ai-tools
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "${LOG_MAX_SIZE:-5m}"
        max-file: "${LOG_MAX_FILE:-5}"

networks:
  ai-tools:
    external: true
  traefik:
    external: true
    name: "${TRAEFIK_NETWORK:-traefik}"
