services:
  default: {}

  traefik:
    networks:
      - traefik
    labels:
      traefik.enable: "true"
      traefik.docker.network: "${TRAEFIK_NETWORK:-traefik}"
      traefik.http.routers.minimax-openai-image-proxy.rule: "Host(`${TRAEFIK_HOST}`)"
      traefik.http.routers.minimax-openai-image-proxy.entrypoints: "${TRAEFIK_ENTRYPOINTS:-websecure}"
      traefik.http.routers.minimax-openai-image-proxy.middlewares: "${TRAEFIK_ACCESS_POLICY:-default-access@file}"
      traefik.http.routers.minimax-openai-image-proxy.service: minimax-openai-image-proxy
      traefik.http.services.minimax-openai-image-proxy.loadbalancer.server.port: "${TRAEFIK_SERVICE_PORT:-8080}"
